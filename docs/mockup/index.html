<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz App — Interactive Mockup</title>
<link rel="stylesheet" href="assets/katex/katex.min.css">
<style>
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
    src: url('assets/fonts/inter-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('assets/fonts/instrument-serif-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Instrument Serif';
    font-style: italic;
    font-weight: 400;
    font-display: swap;
    src: url('assets/fonts/instrument-serif-italic-latin.woff2') format('woff2');
  }

  :root, [data-theme="light"] {
    --page-bg: #ecece5;
    --page-dot: #d9d9d0;
    --bg: #f8f8f4;
    --surface: #ffffff;
    --surface-2: #f0f0e9;
    --surface-3: #e8e8df;
    --ink: #1b1c18;
    --ink-2: #35362f;
    --muted: #74756c;
    --muted-2: #94958b;
    --line: #e5e5dd;
    --line-strong: #d6d6cc;
    --accent: #3a5a40;
    --accent-strong: #2e4934;
    --accent-ink: #ffffff;
    --accent-soft: #edf3ee;
    --good: #2f6b3c;
    --good-soft: #e9f3ea;
    --mid: #8a6113;
    --mid-soft: #fbf3df;
    --low: #9a3f37;
    --low-soft: #faeaE7;
    --danger: #a3413a;
    --danger-soft: #fbecea;
    --frame: #12130f;
    --shadow: 0 30px 70px rgba(26, 28, 22, .22), 0 2px 8px rgba(26, 28, 22, .08);
    --shadow-sm: 0 1px 2px rgba(26, 28, 22, .05), 0 6px 18px rgba(26, 28, 22, .04);
  }
  [data-theme="dark"] {
    --page-bg: #0b0c09;
    --page-dot: #20221c;
    --bg: #121410;
    --surface: #1a1c17;
    --surface-2: #23261f;
    --surface-3: #2c3027;
    --ink: #edeee8;
    --ink-2: #d7d9d1;
    --muted: #a4a79b;
    --muted-2: #7e8176;
    --line: #2d3128;
    --line-strong: #3b4034;
    --accent: #a9c7af;
    --accent-strong: #c0d8c4;
    --accent-ink: #142016;
    --accent-soft: #223025;
    --good: #9fceaa;
    --good-soft: #1d2b20;
    --mid: #e0bc72;
    --mid-soft: #2b2517;
    --low: #e09a90;
    --low-soft: #2f1d1a;
    --danger: #e2988f;
    --danger-soft: #301e1b;
    --frame: #050604;
    --shadow: 0 32px 80px rgba(0, 0, 0, .55), 0 2px 10px rgba(0, 0, 0, .35);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 22px rgba(0, 0, 0, .18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background-color: var(--page-bg);
    background-image: radial-gradient(var(--page-dot) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .5; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .display { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -.015em; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .icon { display: block; flex: none; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .wide { width: 100%; }
  .small { font-size: 12px; }
  .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }

  /* Stage + phone */
  .stage { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; gap: 30px; padding: 28px; }
  .device-wrap { position: sticky; top: 28px; flex: none; }
  .device {
    width: 394px; height: 848px; padding: 2px; border-radius: 48px;
    background: var(--frame); box-shadow: var(--shadow); position: relative;
  }
  .device-screen {
    width: 390px; height: 844px; border-radius: 46px; overflow: hidden;
    background: var(--bg); display: flex; flex-direction: column; position: relative;
  }
  .statusbar {
    height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px 0 30px; font-size: 12.5px; font-weight: 650; color: var(--ink);
    letter-spacing: .01em; position: relative; z-index: 2;
  }
  .statusbar .status-icons { display: flex; align-items: center; gap: 6px; }
  .statusbar .bars { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
  .statusbar .bars i { display: block; width: 2.5px; background: var(--ink); border-radius: 1px; }
  .statusbar .bars i:nth-child(1) { height: 4px; opacity: .5; }
  .statusbar .bars i:nth-child(2) { height: 6px; opacity: .65; }
  .statusbar .bars i:nth-child(3) { height: 8px; opacity: .8; }
  .statusbar .bars i:nth-child(4) { height: 10px; }
  .statusbar .battery { width: 21px; height: 10px; border: 1.3px solid var(--ink); border-radius: 3px; position: relative; opacity: .9; }
  .statusbar .battery::after { content: ''; position: absolute; right: -3.5px; top: 2.5px; width: 2px; height: 4px; background: var(--ink); border-radius: 0 1px 1px 0; }
  .statusbar .battery i { position: absolute; inset: 2px; right: 4px; background: var(--ink); border-radius: 1px; }
  .home-indicator { height: 26px; flex: none; display: grid; place-items: center; }
  .home-indicator i { width: 122px; height: 4px; border-radius: 99px; background: var(--ink); opacity: .22; }

  .app { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; overflow: hidden; }
  #screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }

  .appbar {
    height: 56px; flex: none; display: grid; grid-template-columns: 48px 1fr 48px;
    align-items: center; padding: 0 6px; gap: 2px;
  }
  .appbar-slot { width: 40px; height: 40px; }
  .appbar-title {
    font-size: 15.5px; font-weight: 650; text-align: center; letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px;
  }
  .appbar-actions { display: flex; justify-content: flex-end; align-items: center; gap: 2px; }
  .icon-btn {
    width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 12px;
    background: transparent; color: var(--ink-2); transition: background .15s ease, transform .15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); }
  .icon-btn:active { transform: scale(.94); }

  .content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px 20px 96px; scrollbar-width: none; overscroll-behavior: contain; }
  .content::-webkit-scrollbar { display: none; }
  .content.flush { padding-left: 0; padding-right: 0; }

  /* Typography blocks */
  .hero { padding: 6px 0 20px; }
  .hero h1 { font-size: 36px; line-height: 1.05; margin: 7px 0 8px; }
  .hero-sub { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; max-width: 300px; }
  .hero-meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .hero-meta .dot-sep { width: 3px; height: 3px; background: var(--muted-2); border-radius: 50%; }
  .screen-intro { padding: 4px 0 18px; }
  .screen-intro h1 { font-size: 34px; line-height: 1.06; margin: 5px 0 6px; }
  .screen-intro p { color: var(--muted); margin: 0; font-size: 13px; }

  .crumbs { display: flex; align-items: center; gap: 2px; overflow-x: auto; padding: 0 0 14px; scrollbar-width: none; }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumb { border: 0; background: transparent; color: var(--muted); padding: 5px 4px; font-size: 12px; border-radius: 6px; white-space: nowrap; }
  .crumb:hover { color: var(--ink); background: var(--surface-2); }
  .crumb.current { color: var(--ink); font-weight: 600; }
  .crumb-sep { color: var(--muted-2); flex: none; opacity: .7; }

  .folder-summary { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; padding: 0 0 12px; }
  .folder-summary .dot-sep { width: 3px; height: 3px; background: var(--muted-2); border-radius: 50%; }

  .section-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 6px; }
  .section-head > span:first-child { font-size: 10.5px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .section-count { font-size: 11px; color: var(--muted); background: var(--surface-2); border-radius: 99px; padding: 1px 7px; }

  /* Rows */
  .rows { border-top: 1px solid var(--line); }
  .row { display: flex; align-items: stretch; border-bottom: 1px solid var(--line); }
  .row-hit {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 13px 2px;
    border: 0; background: transparent; text-align: left; border-radius: 0;
  }
  .row-hit:hover .row-title { color: var(--accent); }
  .row-icon {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: var(--surface-2); color: var(--ink-2);
  }
  .row-icon.quiz { background: var(--accent-soft); color: var(--accent); }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .row-title { font-size: 14px; font-weight: 600; letter-spacing: -.005em; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: normal; overflow: hidden; transition: color .15s ease; }
  .row-meta { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-end { display: flex; align-items: center; gap: 7px; color: var(--muted-2); flex: none; padding-left: 6px; }
  .row-more {
    width: 34px; flex: none; border: 0; background: transparent; color: var(--muted-2); border-radius: 9px;
    display: grid; place-items: center; margin-left: 2px;
  }
  .row-more:hover { background: var(--surface-2); color: var(--ink); }
  .row:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }

  .score-badge {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px; font-weight: 700; padding: 3px 6px; border-radius: 7px; letter-spacing: -.02em;
  }
  .score-badge.good { color: var(--good); background: var(--good-soft); }
  .score-badge.mid { color: var(--mid); background: var(--mid-soft); }
  .score-badge.low { color: var(--low); background: var(--low-soft); }

  /* Buttons */
  .btn {
    min-height: 46px; border: 1px solid transparent; border-radius: 12px; padding: 0 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 13.5px; font-weight: 650; letter-spacing: -.005em;
    transition: background .15s ease, border-color .15s ease, transform .15s ease, color .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-strong); }
  .btn.secondary { background: var(--surface); border-color: var(--line-strong); color: var(--ink); }
  .btn.secondary:hover { background: var(--surface-2); }
  .btn.ghost { background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn.danger { background: var(--danger); color: #fff; }
  [data-theme="dark"] .btn.danger { color: #1d0e0c; }
  .btn.outline { background: transparent; border-color: var(--line-strong); color: var(--ink); }
  .btn.outline:hover { background: var(--surface-2); }
  .btn.small { min-height: 34px; padding: 0 12px; font-size: 12.5px; border-radius: 10px; }
  .btn .spinner { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
  .text-btn { border: 0; background: transparent; color: var(--accent); font-weight: 650; font-size: 12.5px; padding: 2px; border-radius: 4px; }
  .text-btn:hover { text-decoration: underline; }
  .wide + .wide { margin-top: 8px; }
  .center-hint { text-align: center; color: var(--muted); font-size: 11.5px; margin: 10px 0 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .chip { font-size: 10.8px; font-weight: 550; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
  .chip.soft { background: var(--accent-soft); border-color: transparent; color: var(--accent); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-sm); }
  .card + .card { margin-top: 12px; }
  .card h3 { font-size: 14px; margin: 0 0 8px; }
  .card p { margin: 0; color: var(--muted); font-size: 12.5px; }

  /* Detail */
  .detail-hero { padding: 6px 0 18px; }
  .detail-hero h1 { font-size: 32px; line-height: 1.08; margin: 7px 0 8px; }
  .detail-sub { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 0; max-width: 320px; }
  .detail-hero .chips { margin-bottom: 18px; }

  /* Attempt rows */
  .attempt-row { width: 100%; display: flex; align-items: center; gap: 11px; padding: 12px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; }
  .attempt-row:hover { background: color-mix(in srgb, var(--surface) 60%, transparent); }
  .attempt-row:last-child { border-bottom: 0; }
  .attempt-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .attempt-score { font-size: 13px; font-weight: 650; }
  .attempt-meta { font-size: 11.5px; color: var(--muted); }
  .attempt-row .chev { color: var(--muted-2); }

  /* Empty / error / skeleton */
  .empty { padding: 42px 18px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .empty .empty-icon { width: 58px; height: 58px; border-radius: 18px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); margin-bottom: 15px; }
  .empty h2 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 25px; margin: 0 0 6px; letter-spacing: -.01em; }
  .empty p { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; max-width: 260px; line-height: 1.55; }
  .empty .btn { min-width: 170px; }
  .error-box { padding: 40px 18px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .error-box .error-icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--danger-soft); color: var(--danger); margin-bottom: 14px; }
  .error-box h2 { font-size: 17px; margin: 0 0 6px; }
  .error-box p { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; max-width: 270px; }
  .skeleton-row { display: flex; align-items: center; gap: 12px; padding: 13px 2px; border-bottom: 1px solid var(--line); }
  .skeleton-row .s-icon { width: 42px; height: 42px; border-radius: 12px; flex: none; }
  .skeleton-row .s-lines { flex: 1; display: flex; flex-direction: column; gap: 7px; }
  .skeleton-row .s-line { height: 9px; border-radius: 5px; }
  .skeleton-row .s-line.short { width: 45%; }
  .skeleton-row .s-line.mid { width: 70%; }
  .skeleton { background: linear-gradient(90deg, var(--surface-2) 20%, var(--surface-3) 40%, var(--surface-2) 60%); background-size: 220% 100%; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }

  /* FAB */
  .fab {
    position: absolute; right: 20px; bottom: 22px; z-index: 5;
    width: 54px; height: 54px; border-radius: 18px; border: 0;
    background: var(--accent); color: var(--accent-ink); display: grid; place-items: center;
    box-shadow: 0 10px 24px rgba(31, 52, 35, .28); transition: transform .15s ease, background .15s ease;
  }
  .fab:hover { background: var(--accent-strong); }
  .fab:active { transform: scale(.94); }
  .sheet-open .fab { display: none; }

  /* Footer */
  .footer { flex: none; padding: 11px 20px 14px; background: var(--bg); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .footer-progress { flex: 1; font-size: 11.5px; color: var(--muted); }
  .footer .btn { min-height: 44px; }
  .attempt-footer { padding-bottom: 16px; }

  /* Timer */
  .timer-chip {
    display: inline-flex; align-items: center; gap: 5px; justify-self: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 650; color: var(--ink); background: var(--surface-2);
    padding: 5px 9px; border-radius: 99px;
  }
  .timer-chip .icon { color: var(--muted); }

  /* Questions */
  .progress-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); padding: 4px 2px 7px; }
  .progress-meta span:first-child { color: var(--ink-2); font-weight: 600; }
  .progress { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-bottom: 18px; }
  .progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
  .question-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 17px 16px 15px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
  .question-head { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
  .question-num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; color: var(--muted); background: var(--surface-2); padding: 2px 6px; border-radius: 6px; }
  .type-chip { font-size: 9.5px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
  .type-chip.msq { background: #eef0f8; color: #4b5a86; }
  [data-theme="dark"] .type-chip.msq { background: #23293b; color: #a9b7dd; }
  .type-chip.numerical { background: var(--mid-soft); color: var(--mid); }
  .marks { margin-left: auto; font-size: 10.5px; color: var(--muted-2); }
  .question-prompt { font-size: 14.5px; font-weight: 600; line-height: 1.5; margin: 0 0 13px; letter-spacing: -.005em; }
  .question-prompt .katex { font-size: 1.02em; }
  .options { display: flex; flex-direction: column; gap: 7px; }
  .option {
    width: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 10px 11px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--surface); text-align: left;
    font-size: 13px; line-height: 1.45; color: var(--ink-2); transition: border-color .15s ease, background .15s ease;
  }
  .option:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .option.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .option .control {
    width: 18px; height: 18px; flex: none; border: 1.5px solid var(--line-strong); border-radius: 50%;
    display: grid; place-items: center; margin-top: .5px; background: var(--surface); transition: all .15s ease;
  }
  .option.msq .control { border-radius: 5px; }
  .option.selected .control { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .option .control .dot { width: 7px; height: 7px; border-radius: 50%; background: transparent; }
  .option.selected .control .dot { background: var(--accent-ink); }
  .option .control .icon { opacity: 0; }
  .option.selected .control .icon { opacity: 1; }
  .numeric-wrap { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); overflow: hidden; }
  .numeric-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .numeric-input { flex: 1; min-width: 0; height: 46px; border: 0; background: transparent; padding: 0 12px; font-size: 14px; outline: none; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .numeric-input::placeholder { color: var(--muted-2); font-family: 'Inter', sans-serif; font-size: 13px; }
  .unit { flex: none; padding: 0 12px; color: var(--muted); font-size: 12px; border-left: 1px solid var(--line); height: 26px; display: flex; align-items: center; }

  /* Attempt intro / rules */
  .attempt-intro { padding: 10px 0 18px; }
  .attempt-intro h1 { font-size: 34px; line-height: 1.06; margin: 6px 0 0; }
  .rules-card { margin-bottom: 14px; }
  .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .rules li { display: flex; gap: 9px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
  .rules li .icon { color: var(--accent); margin-top: 2px; }

  /* Result */
  .result-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 0 22px; }
  .score-ring { width: 156px; height: 156px; position: relative; margin-bottom: 18px; }
  .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring .track { fill: none; stroke: var(--surface-2); stroke-width: 9; }
  .score-ring .meter { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .8s ease; }
  .score-ring .meter.mid { stroke: var(--mid); }
  .score-ring .meter.low { stroke: var(--low); }
  .score-ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-pct { font-family: 'Instrument Serif', Georgia, serif; font-size: 40px; line-height: 1; letter-spacing: -.02em; }
  .score-frac { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; color: var(--muted); margin-top: 5px; }
  .result-hero h1 { font-size: 30px; line-height: 1.05; margin: 6px 0 7px; }
  .result-hero p { font-size: 12.5px; margin: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 13px; }
  .stat-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .stat-value { font-size: 14.5px; font-weight: 650; letter-spacing: -.01em; }
  .stat-value.small { font-size: 11.5px; font-weight: 550; color: var(--ink-2); }
  .saved-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 4px 9px; margin-bottom: 14px; }

  /* Import */
  .import-target { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; margin-bottom: 14px; }
  .import-target .icon { color: var(--accent); }
  .dropzone {
    border: 1.5px dashed var(--line-strong); border-radius: 18px; padding: 28px 18px 22px;
    text-align: center; background: var(--surface); transition: border-color .15s ease, background .15s ease;
  }
  .dropzone.dragging { border-color: var(--accent); background: var(--accent-soft); }
  .drop-icon { width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin: 0 auto 13px; }
  .dropzone h2 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 5px; }
  .dropzone p { color: var(--muted); font-size: 12px; margin: 0 0 15px; }
  .dropzone .btn { min-width: 160px; }
  .drop-links { margin-top: 13px; display: flex; align-items: center; justify-content: center; gap: 14px; }
  .file-list { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
  .file-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 13px; }
  .file-card.invalid { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
  .file-head { display: flex; align-items: center; gap: 9px; }
  .file-icon { width: 32px; height: 32px; border-radius: 9px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; flex: none; }
  .file-card.valid .file-icon { background: var(--good-soft); color: var(--good); }
  .file-card.invalid .file-icon { background: var(--danger-soft); color: var(--danger); }
  .file-name { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { display: block; font-size: 10.5px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .status-chip { font-size: 9.5px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 5px; flex: none; }
  .status-chip.valid { background: var(--good-soft); color: var(--good); }
  .status-chip.invalid { background: var(--danger-soft); color: var(--danger); }
  .status-chip.reading { background: var(--mid-soft); color: var(--mid); }
  .file-title { font-size: 13px; font-weight: 600; margin: 10px 0 3px; }
  .file-meta { font-size: 11px; color: var(--muted); }
  .repair-note { margin-top: 8px; font-size: 10.8px; color: var(--mid); background: var(--mid-soft); border-radius: 8px; padding: 6px 8px; line-height: 1.4; }
  .file-errors { margin: 8px 0 0; padding-left: 16px; color: var(--danger); font-size: 11px; line-height: 1.45; }
  .file-errors li { margin: 3px 0; }
  .batch-summary { display: flex; justify-content: space-between; gap: 10px; padding: 12px 2px 2px; font-size: 11px; color: var(--muted); }
  .import-footer { flex-wrap: wrap; }
  .import-footer .footer-progress { min-width: 90px; }

  /* Sheet */
  .overlay { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; justify-content: flex-end; }
  .backdrop { position: absolute; inset: 0; background: rgba(8, 10, 7, .42); animation: fade-in .18s ease; }
  .sheet {
    position: relative; z-index: 1; background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom)); max-height: 84%; overflow-y: auto;
    animation: sheet-up .24s cubic-bezier(.2, .8, .2, 1); box-shadow: 0 -10px 40px rgba(0,0,0,.18);
  }
  .grabber { width: 36px; height: 4px; border-radius: 99px; background: var(--line-strong); margin: 0 auto 14px; }
  .sheet h3 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 24px; margin: 0 0 6px; letter-spacing: -.01em; }
  .sheet .sheet-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 16px; line-height: 1.5; }
  .sheet .sheet-actions { display: flex; flex-direction: column; gap: 7px; margin-top: 16px; }
  .sheet .sheet-actions.row-actions { gap: 2px; }
  .sheet .action-row { display: flex; align-items: center; gap: 11px; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; font-size: 13.5px; }
  .sheet .action-row:last-child { border-bottom: 0; }
  .sheet .action-row:hover { background: var(--surface-2); }
  .sheet .action-row.destructive { color: var(--danger); }
  .sheet .action-row .icon { color: var(--muted); }
  .sheet .action-row.destructive .icon { color: var(--danger); }
  .danger-copy { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; font-size: 11.5px; line-height: 1.45; margin: 14px 0 4px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 11px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
  .input {
    height: 46px; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--bg);
    padding: 0 12px; font-size: 14px; outline: none; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .field-error { color: var(--danger); font-size: 11px; min-height: 15px; }
  .dialog-actions { display: flex; gap: 8px; margin-top: 12px; }
  .dialog-actions .btn { flex: 1; }

  /* Toast */
  #toast-root { position: absolute; left: 0; right: 0; bottom: 88px; z-index: 40; display: flex; justify-content: center; pointer-events: none; padding: 0 20px; }
  .toast {
    max-width: 320px; background: #24261f; color: #f4f5ef; border-radius: 12px; padding: 10px 14px;
    font-size: 12px; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    animation: toast-in .18s ease; text-align: center;
  }
  [data-theme="dark"] .toast { background: #e7e9e1; color: #171914; }
  .toast .icon { display: inline-block; vertical-align: -3px; margin-right: 4px; }

  /* Dev tools */
  .devtools {
    width: 310px; flex: none; position: sticky; top: 28px; align-self: flex-start;
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 15px;
    box-shadow: var(--shadow-sm); font-size: 12px;
  }
  .dev-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dev-head strong { font-size: 13px; letter-spacing: -.01em; }
  .dev-badge { font-size: 9px; font-weight: 800; letter-spacing: .1em; color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 4px; }
  .dev-section { border-top: 1px solid var(--line); padding: 12px 0 2px; margin-top: 12px; }
  .dev-section:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
  .dev-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; color: var(--muted); font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; }
  .dev-select { width: 100%; height: 36px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--bg); padding: 0 8px; font-size: 12px; outline: none; }
  .segment { display: flex; gap: 3px; background: var(--surface-2); border-radius: 8px; padding: 3px; }
  .segment button { flex: 1; border: 0; background: transparent; border-radius: 6px; padding: 5px 2px; font-size: 10.5px; font-weight: 600; color: var(--muted); }
  .segment button.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .dev-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .dev-buttons .btn { flex: 1; min-height: 34px; font-size: 11.5px; padding: 0 8px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; font-size: 12px; }
  .switch { position: relative; width: 36px; height: 21px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: var(--surface-3); border-radius: 99px; }
  .switch .slider::before { content: ''; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.15); transition: transform .18s ease; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(15px); }
  .datalog { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 11px; }
  .datalog-head { display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 6px; }
  .datalog-list { list-style: none; margin: 0; padding: 0; max-height: 154px; overflow-y: auto; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; line-height: 1.55; }
  .datalog-list li { display: flex; gap: 6px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .datalog-list li:last-child { border-bottom: 0; }
  .datalog-list .method { color: var(--muted); width: 30px; flex: none; }
  .datalog-list .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .datalog-list .status { font-weight: 700; }
  .status-2 { color: var(--good); }
  .status-4 { color: var(--mid); }
  .status-5 { color: var(--danger); }
  .dev-note { color: var(--muted-2); font-size: 10px; line-height: 1.45; margin-top: 9px; }

  /* Screenshot mode */
  .screenshot-mode .devtools { display: none; }
  .screenshot-mode .stage { padding: 0; min-height: 100vh; align-items: center; }
  .screenshot-mode .device { width: 390px; height: 844px; padding: 0; border-radius: 0; background: transparent; box-shadow: none; }
  .screenshot-mode .device-screen { border-radius: 0; }
  .screenshot-mode .statusbar, .screenshot-mode .home-indicator { display: none; }
  .screenshot-exit {
    display: none; position: fixed; right: 18px; bottom: 18px; z-index: 100;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 99px;
    padding: 9px 14px; font-size: 12px; font-weight: 600; box-shadow: var(--shadow-sm);
  }
  .screenshot-mode .screenshot-exit { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheet-up { from { transform: translateY(28px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  @media (max-width: 1120px) {
    .stage { flex-direction: column; align-items: center; }
    .device-wrap { position: static; }
    .devtools { position: static; width: min(394px, 100%); }
  }
  @media (max-width: 560px) {
    body { background-image: none; }
    .stage { padding: 0; display: block; }
    .device-wrap { width: 100%; }
    .device { width: 100%; height: 100dvh; padding: 0; border-radius: 0; box-shadow: none; }
    .device-screen { width: 100%; height: 100dvh; border-radius: 0; }
    .statusbar, .home-indicator { display: none; }
    .devtools { margin: 16px; width: calc(100% - 32px); position: static; }
    .appbar { height: 52px; }
    .content { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>

<script type="text/plain" id="sample-quiz-json">
{"title": "Computer Networks, Lecture 1: Classful IPv4 Addressing", "subtitle": "Classes, leading bits, first-octet ranges, reserved patterns, and practical network and host counts", "key": "computernetworks-l01-quiz",
"questions": [
{"t":"MCQ","d":"Medium","q":"What fraction of the whole IPv4 address space belongs to Class C?","o":["1/4","1/8","1/16","1/2"],"a":1,"e":"Class C fixes 3 leading bits, so it holds \(2^{29}\) addresses out of \(2^{32}\), which is 1/8 (12.5%). 1/4 is Class B (2 fixed bits), 1/2 is Class A, and 1/16 is each of Class D and Class E."},
{"t":"MCQ","d":"Medium","q":"An IPv4 address in binary begins 1011 0000. To which class does it belong?","o":["Class A","Class B","Class C","Class D"],"a":1,"e":"The first bit is 1, so it is not Class A; the first two bits are 10, which is the Class B prefix. Class C would need the prefix 110 and Class D would need 1110. The prefixes never overlap, so the answer is unique."},
{"t":"MCQ","d":"Medium","q":"The first octet of an address is 200. Which class is it?","o":["Class A","Class B","Class C","Class D"],"a":2,"e":"Class C covers first octets 192 to 223, and 200 lies in that range. Class B stops at 191, so 200 is not Class B, and Class D starts at 224."},
{"t":"MCQ","d":"Medium","q":"How many networks can be formed in Class A in practice?","o":["128","126","256","\(2^{24}\)"],"a":1,"e":"Seven bits are free (the first bit is fixed at 0), giving \(2^7 = 128\) combinations, but network 0 (all zeros) and network 127 (loopback) are reserved, so \(128 - 2 = 126\). The value 128 forgets the removal, 256 ignores the fixed bit, and \(2^{24}\) is the host count scale."},
{"t":"MCQ","d":"Medium","q":"How many usable host addresses does one Class C network have?","o":["256","254","255","\(2^{21}\)"],"a":1,"e":"The host ID is 8 bits, giving 256 combinations, but the all-0 and all-1 host IDs cannot be assigned, so 254 remain. 256 forgets the removal, 255 removes only one, and \(2^{21}\) is the number of Class C networks, not hosts."},
{"t":"MCQ","d":"Hard","q":"The first octet of a Class B address ranges over only 64 values (128 to 191), yet Class B has \(2^{14}\) networks. What explains this?","o":["The second octet is part of the Class B network ID and has 256 values for each first-octet value","Class B uses 14 bits of its host ID for networks","The range 128 to 191 contains \(2^{14}\) values","Some networks are reused across several first-octet values"],"a":0,"e":"The Class B network ID is 16 bits (two octets). With 64 first-octet values and 256 second-octet values each, there are \(64 \times 256 = 2^6 \times 2^8 = 2^{14}\) networks. The range 128 to 191 holds just 64 values, not \(2^{14}\), and the host ID is not involved in counting networks."},
{"t":"MCQ","d":"Medium","q":"Which of these addresses is reserved for loopback testing and inter-process communication on the same machine?","o":["10.0.0.1","127.0.0.1","192.168.0.1","128.0.0.1"],"a":1,"e":"The 127.x.x.x block is reserved for self-connectivity, loopback testing and inter-process communication, so it can never be given to a computer. The other addresses belong to ordinary Class A, C and B ranges."},
{"t":"MCQ","d":"Hard","q":"What is the practical number of networks in Class B?","o":["\(2^{16}\)","\(2^{14}\)","\(2^{14}-2\)","\(2^{15}\)"],"a":1,"e":"Two of the 16 network bits are fixed to 10, leaving 14 free bits, so \(2^{14}\) networks. Nothing is subtracted because with the prefix 10 the network ID can never be all 0s or all 1s, which rules out \(2^{14}-2\). \(2^{16}\) is the theoretical count."},
{"t":"MCQ","d":"Medium","q":"Which of the following dotted decimal addresses is invalid?","o":["172.16.255.0","10.0.256.1","200.0.0.255","127.0.0.1"],"a":1,"e":"Each octet is 8 bits, so it can only be 0 to 255. The value 256 in the third octet of 10.0.256.1 is impossible. The others are well-formed addresses, even if some are not assignable to a computer."},
{"t":"MCQ","d":"Hard","q":"What fraction of the address space is Class D and Class E taken together?","o":["1/16","1/8","1/4","1/32"],"a":1,"e":"Each of D and E fixes 4 bits and holds \(2^{28}\) addresses, so together \(2^{29}\), which is \(2^{29}/2^{32} = 1/8\), or 12.5%. The value 1/16 is only one of them, and 1/4 is Class B."},
{"t":"MCQ","d":"Hard","q":"A student cancels 255 from the Class E first-octet range because it looks like all ones. Why is this wrong?","o":["Class E has no network ID or host ID, so the all-0 and all-1 rules do not apply to it","255 is a valid Class D value","The all-ones rule applies only to the first octet, and 255 is the last","The rule removes 240, not 255"],"a":0,"e":"The all-0 and all-1 rules are about the network ID and host ID. Class E has neither, so no value in 240 to 255 is cancelled by those rules. The other reasons are made up: 255 is not Class D, and the rule is not tied to the first octet alone."},
{"t":"MCQ","d":"Medium","q":"Which first-octet value is a usable Class A network?","o":["0","127","126","128"],"a":2,"e":"Usable Class A first octets are 1 to 126. The value 0 is an all-zero network ID, 127 is reserved for loopback, and 128 belongs to Class B."},
{"t":"MCQ","d":"Hard","q":"In Class B the number of networks is \(2^m\) and the number of usable hosts per network is \(2^n - 2\). What is the ratio \(m/n\)?","o":["7/8","1","14/15","3/4"],"a":0,"e":"Practical Class B has 14 free network bits, so \(m = 14\), and 16 host bits, so \(n = 16\). Thus \(m/n = 14/16 = 7/8\). Using the theoretical 16 for m would wrongly give 1."},
{"t":"MCQ","d":"Hard","q":"Suppose a Class B style address keeps the leading bits 10 but uses 20 bits for the network ID. How many usable hosts does each network have?","o":["4096","4094","1022","\(2^{18}\)"],"a":1,"e":"The host ID is the remaining \(32 - 20 = 12\) bits, so \(2^{12} = 4096\) combinations, minus the all-0 and all-1 host IDs gives 4094. 4096 forgets the removal, \(2^{18}\) is the number of networks, and 1022 would correspond to 10 host bits."},
{"t":"MCQ","d":"Medium","q":"For what purpose are Class D addresses reserved?","o":["Multicasting","Research and future use","Loopback testing","Assigning to large networks"],"a":0,"e":"Class D (first octet 224 to 239) is used for multicasting; the meaning of multicasting is the subject of the next lecture. Research and future use is Class E, and loopback is the 127 block of Class A."},
{"t":"MSQ","d":"Medium","q":"Which of the following give the correct leading bits of the class?","o":["Class A: 0","Class B: 10","Class C: 111","Class E: 1111"],"a":[0,1,3],"e":"Class A starts with 0, Class B with 10 and Class E with 1111. Class C starts with 110, not 111; the pattern 111 is shared by Classes D and E before the fourth bit separates them."},
{"t":"MSQ","d":"Medium","q":"Which of these addresses cannot be assigned to a computer?","o":["10.0.0.0","10.255.255.255","127.0.0.5","10.0.0.1"],"a":[0,1,2],"e":"10.0.0.0 has an all-zero host ID, 10.255.255.255 has an all-one host ID, and 127.0.0.5 is in the loopback block. 10.0.0.1 is an ordinary valid Class A host address, since only the two extreme host patterns are removed."},
{"t":"MSQ","d":"Medium","q":"Which first-octet values belong to Class B?","o":["128","191","192","150"],"a":[0,1,3],"e":"Class B spans 128 to 191, so 128, 191 and 150 are inside. 192 is the first Class C value."},
{"t":"MSQ","d":"Medium","q":"Which classes have no network ID and no host ID?","o":["Class A","Class B","Class D","Class E"],"a":[2,3],"e":"Classes D and E use the whole address as a single unit (multicasting, and research or future use). Classes A and B are both split into a network ID and a host ID."},
{"t":"MSQ","d":"Hard","q":"Which statements about Class A are correct?","o":["The usable first octets are 1 to 126","The host ID has 24 bits","Seven bits of the network ID are free","The practical number of networks is \(2^8\)"],"a":[0,1,2],"e":"The first bit is fixed at 0, so 7 of the 8 network bits are free; with 0 and 127 removed, the usable first octets are 1 to 126; the host ID is 24 bits. The practical network count is \(2^7 - 2 = 126\), not \(2^8\), which is the theoretical figure."},
{"t":"MSQ","d":"Hard","q":"In which classes is the practical number of networks exactly \(2^{\text{free network bits}}\), with nothing subtracted?","o":["Class A","Class B","Class C"],"a":[1,2],"e":"With prefixes 10 and 110 the network ID can never be all 0s or all 1s, so nothing is cancelled and the counts are \(2^{14}\) and \(2^{21}\). In Class A the network 0 and the loopback network 127 are removed, giving \(2^7 - 2\)."},
{"t":"MSQ","d":"Hard","q":"Which statements about the sizes of the classes are correct?","o":["Class D and Class E have the same number of addresses","Class C has twice as many addresses as Class D","Class A has twice as many addresses as Class B","Class B has the same number of addresses as Class C"],"a":[0,1,2],"e":"Each class fixes one more bit than the previous (except D and E, which both fix 4), so sizes are \(2^{31}, 2^{30}, 2^{29}, 2^{28}, 2^{28}\). Hence D equals E, C is twice D, and A is twice B. B (\(2^{30}\)) is twice C (\(2^{29}\)), not equal to it."},
{"t":"MSQ","d":"Medium","q":"Which hexadecimal-to-decimal conversions of a single octet are correct?","o":["C2 = 194","2F = 47","B5 = 181","FF = 256"],"a":[0,1,2],"e":"C2: \(12 \times 16 + 2 = 194\). 2F: \(2 \times 16 + 15 = 47\). B5: \(11 \times 16 + 5 = 181\). FF is \(15 \times 16 + 15 = 255\), not 256, since an octet never exceeds 255."},
{"t":"MSQ","d":"Medium","q":"Which first-octet values belong to Class C?","o":["192","200","223","224"],"a":[0,1,2],"e":"Class C covers 192 to 223. The value 224 is the first Class D value."},
{"t":"MSQ","d":"Hard","q":"An address has first octet 150. Which statements are correct?","o":["It is Class B","Its network ID is 16 bits","Its host ID is 16 bits","Each network of its class has \(2^{16}\) usable hosts"],"a":[0,1,2],"e":"150 lies in 128 to 191, so Class B, which splits 16 and 16. The usable hosts per network are \(2^{16} - 2\), not \(2^{16}\), because the all-0 and all-1 host IDs are removed."},
{"t":"NAT","d":"Medium","q":"Convert the hexadecimal octet D4 to decimal.","a":212,"e":"D is 13, so \(13 \times 16 + 4 = 208 + 4 = 212\). The common error is to multiply the right digit instead of the left by 16."},
{"t":"NAT","d":"Medium","q":"How many usable host addresses does a network have if its host ID is 10 bits long? Assume the all-0 and all-1 host IDs are not assignable.","a":1022,"e":"There are \(2^{10} = 1024\) host combinations; removing the all-0 and all-1 ones leaves 1022. Giving 1024 forgets the reserved patterns.","u":"hosts"},
{"t":"NAT","d":"Medium","q":"The practical number of Class C networks is \(2^x\). Find x.","a":21,"e":"The network ID is 24 bits and 3 are fixed by the prefix 110, so 21 bits vary. Nothing is removed. Answering 24 is the theoretical figure."},
{"t":"NAT","d":"Medium","q":"How many networks can Class A have in practice?","a":126,"e":"\(2^7 = 128\) combinations of the free bits, minus the all-zero network and the loopback network 127, gives 126. The figure 128 forgets the two reserved networks."},
{"t":"NAT","d":"Medium","q":"Convert the binary octet 11101110 to decimal.","a":238,"e":"The two 0 bits have weights 16 and 1, total 17, so \(255 - 17 = 238\). Checking: \(128+64+32+8+4+2 = 238\)."},
{"t":"NAT","d":"Medium","q":"How many usable hosts can one Class B network have?","a":65534,"e":"The host ID is 16 bits, so \(2^{16} = 65536\) combinations, minus 2 reserved patterns gives 65534. The value 65536 forgets the subtraction.","u":"hosts"},
{"t":"NAT","d":"Medium","q":"How many different values does the first octet take across Class D (224 to 239)?","a":16,"e":"The values are 224 through 239 inclusive, and \(239 - 224 + 1 = 16\), which is also \(2^4\) because four bits of the first octet are free. Answering 15 forgets the +1."},
{"t":"NAT","d":"Medium","q":"What percentage of all addresses do Class D and Class E hold together?","a":12.5,"e":"Each holds 6.25%, so together 12.5%. Each class fixes 4 bits, so each is \(2^{28}/2^{32} = 1/16\).","u":"%"},
{"t":"NAT","d":"Hard","q":"A Class B style address keeps the leading bits 10 but uses 20 bits for the network ID. The number of networks is \(2^x\). Find x.","a":18,"e":"Of the 20 network bits, 2 are the fixed prefix 10, leaving 18 free bits, so \(2^{18}\) networks (nothing is cancelled because of the fixed prefix). Answering 20 forgets the fixed bits."},
{"t":"NAT","d":"Medium","q":"Convert the binary octet 11111001 to decimal.","a":249,"e":"The 0 bits have weights 4 and 2, total 6, so \(255 - 6 = 249\)."}
]}

  function loadDb() {
    try {
      var stored = JSON.parse(localStorage.getItem(DB_KEY) || 'null');
      if (stored && stored.version === 1 && Array.isArray(stored.folders) && Array.isArray(stored.quizzes)) {
        return stored;
      }
    } catch (e) {}
    return structuredClone(SEED);
  }
  function saveDb() {
    try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
  }
  function resetDb() {
    db = structuredClone(SEED);
    saveDb();
  }
  function commit() {
    saveDb();
    dataVersion++;
  }

  function folderPath(id) {
    var path = [];
    var guard = 0;
    var current = db.folders.find(function (f) { return f.id === id; });
    while (current && guard++ < 50) {
      path.unshift({ id: current.id, name: current.name });
      current = current.parent_folder_id ? db.folders.find(function (f) { return f.id === current.parent_folder_id; }) : null;
    }
    return path;
  }

  function folderIdsUnder(id) {
    var ids = [id];
    for (var i = 0; i < ids.length; i++) {
      var parent = ids[i];
      db.folders.forEach(function (f) {
        if (f.parent_folder_id === parent && ids.indexOf(f.id) === -1) ids.push(f.id);
      });
    }
    return ids;
  }

  function quizzesInFolders(folderIds) {
    return db.quizzes.filter(function (q) { return folderIds.indexOf(q.folder_id) !== -1; });
  }

  function attemptsForQuiz(id) {
    return db.attempts.filter(function (a) { return a.quiz_id === id; }).sort(function (a, b) {
      return new Date(b.started_at) - new Date(a.started_at);
    });
  }

  function quizSummary(q) {
    var qs = db.questions.filter(function (x) { return x.quiz_id === q.id; });
    var attempts = attemptsForQuiz(q.id);
    var last = attempts[0] || null;
    return {
      id: q.id, folder_id: q.folder_id, title: q.title, subtitle: q.subtitle,
      source_key: q.source_key, created_at: q.created_at,
      question_count: qs.length,
      total_marks: qs.reduce(function (s, x) { return s + (x.marks || 1); }, 0),
      attempt_count: attempts.length,
      last_attempt: last ? { id: last.id, score: last.score, max_score: last.max_score, started_at: last.started_at } : null
    };
  }

  function folderSummary(f) {
    var childFolders = db.folders.filter(function (x) { return x.parent_folder_id === f.id; });
    var childQuizzes = db.quizzes.filter(function (x) { return x.folder_id === f.id; });
    return {

      id: a.id, quiz_id: a.quiz_id, started_at: a.started_at, ended_at: a.ended_at,
      duration_ms: a.duration_ms, score: a.score, max_score: a.max_score,

    };

  function scoreAttempt(quizId, answers) {
    var qs = db.questions.filter(function (q) { return q.quiz_id === quizId; });
    var score = 0;
    var maxScore = 0;
    qs.forEach(function (q) {
      maxScore += q.marks || 1;
      var given = answers ? answers[q.id] : null;
      var correct = false;
      if (q.type === 'numerical') {
        var num = Number(given);
        if (given !== null && given !== '' && isFinite(num) && q.numerical_answer != null) {
          correct = Math.abs(num - q.numerical_answer) <= (q.tolerance == null ? 0 : q.tolerance) + 1e-9;
        }
      } else {
        var opts = db.question_options.filter(function (o) { return o.question_id === q.id; });
        var correctIds = opts.filter(function (o) { return o.is_correct === 1; }).map(function (o) { return o.id; });
        if (q.type === 'mcq') {
          correct = typeof given === 'string' && correctIds.length === 1 && correctIds[0] === given;
        } else if (q.type === 'msq') {
          var selected = Array.isArray(given) ? given : [];
          var selectedUnique = Array.from(new Set(selected));
          correct = selectedUnique.length === correctIds.length &&
            selectedUnique.every(function (id) { return correctIds.indexOf(id) !== -1; });
        }
      }
      if (correct) score += q.marks || 1;
    });
    return { score: score, max_score: maxScore };
  }

  window.__mock = { latencyMs: 350, errorRate: 0 };

  function DataError(code, message) {
    this.code = code;
    this.message = message;
    this.name = 'DataError';
  }
  DataError.prototype = Object.create(Error.prototype);

  function logData(name, outcome, ms) {
    datalog.unshift({ name: name, outcome: outcome, ms: ms });
    if (datalog.length > 50) datalog.pop();
    renderDatalog();
  }

  async function callRepo(name, fn) {
    var started = performance.now();
    await sleep(window.__mock.latencyMs);
    if (window.__mock.errorRate > 0 && Math.random() * 100 < window.__mock.errorRate) {
      logData(name, 'error', Math.round(performance.now() - started));
      throw new DataError('storage_error', 'The local database is unavailable. Please try again.');
    }
    try {
      var result = fn();
      logData(name, 'ok', Math.round(performance.now() - started));
      return result;
    } catch (e) {
      logData(name, 'error', Math.round(performance.now() - started));
      if (e instanceof DataError) throw e;
      throw new DataError('storage_error', e && e.message ? e.message : 'Something went wrong.');
    }
  }

    folderContents: function (id) {
      return callRepo('folderContents', function () {

        if (id !== 'root' && !folder) throw new DataError('folder_not_found', 'This folder no longer exists.');
        var parentId = folder ? folder.id : null;
        var folders = db.folders.filter(function (f) { return f.parent_folder_id === parentId; })
          .sort(function (a, b) { return a.name.localeCompare(b.name); })
          .map(folderSummary);
        var quizzes = db.quizzes.filter(function (q) { return q.folder_id === parentId; })
          .sort(function (a, b) { return new Date(b.created_at) - new Date(a.created_at); })
          .map(quizSummary);

          folder: folder ? { id: folder.id, name: folder.name, parent_folder_id: folder.parent_folder_id, created_at: folder.created_at } : null,
          path: folder ? folderPath(folder.id) : [],
          folders: folders,

        };

    folderDeletePreview: function (id) {

        var ids = folderIdsUnder(id);
        var childIds = ids.filter(function (x) { return x !== id; });
        var quizzes = quizzesInFolders(ids);
        var attempts = db.attempts.filter(function (a) { return quizzes.some(function (q) { return q.id === a.quiz_id; }); });
        return {
