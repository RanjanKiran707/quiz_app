          questions: db.questions.filter(function (q) { return quizzes.some(function (x) { return x.id === q.quiz_id; }); }).length
        };
      });
    },
    createFolder: function (parentId, name) {
      return callRepo('createFolder', function () {
        var trimmed = typeof name === 'string' ? name.trim() : '';
        parentId = parentId || null;
        if (!trimmed) throw new DataError('name_required', 'Give the folder a name.');
        if (trimmed.length > 60) throw new DataError('name_too_long', 'Folder names can be up to 60 characters.');
        if (parentId && !db.folders.some(function (f) { return f.id === parentId; })) {
          throw new DataError('folder_not_found', 'The parent folder no longer exists.');
        }
        var duplicate = db.folders.some(function (f) {
          return (f.parent_folder_id || null) === parentId && f.name.toLowerCase() === trimmed.toLowerCase();
        });
        if (duplicate) throw new DataError('name_taken', 'A folder with this name already exists here.');
        var folder = { id: uuid(), name: trimmed, parent_folder_id: parentId, created_at: new Date().toISOString() };
        db.folders.push(folder);
        commit();
        return folderSummary(folder);
      });
    },
    renameFolder: function (id, name) {
      return callRepo('renameFolder', function () {
        var folder = db.folders.find(function (f) { return f.id === id; });
        if (!folder) throw new DataError('folder_not_found', 'This folder no longer exists.');
        var trimmed = typeof name === 'string' ? name.trim() : '';
        if (!trimmed) throw new DataError('name_required', 'Give the folder a name.');
        if (trimmed.length > 60) throw new DataError('name_too_long', 'Folder names can be up to 60 characters.');
        var duplicate = db.folders.some(function (f) {
          return f.id !== id && (f.parent_folder_id || null) === (folder.parent_folder_id || null) && f.name.toLowerCase() === trimmed.toLowerCase();
        });
        if (duplicate) throw new DataError('name_taken', 'A folder with this name already exists here.');
        folder.name = trimmed;
        commit();
        return folderSummary(folder);
      });
    },
    deleteFolder: function (id) {
      return callRepo('deleteFolder', function () {
        var folder = db.folders.find(function (f) { return f.id === id; });
        if (!folder) throw new DataError('folder_not_found', 'This folder no longer exists.');
        var ids = folderIdsUnder(id);
        var quizzes = quizzesInFolders(ids);
        var quizIds = quizzes.map(function (q) { return q.id; });
        var questionIds = db.questions.filter(function (q) { return quizIds.indexOf(q.quiz_id) !== -1; }).map(function (q) { return q.id; });
        db.attempts = db.attempts.filter(function (a) { return quizIds.indexOf(a.quiz_id) === -1; });
        db.question_options = db.question_options.filter(function (o) { return questionIds.indexOf(o.question_id) === -1; });
        db.questions = db.questions.filter(function (q) { return quizIds.indexOf(q.quiz_id) === -1; });
        db.quizzes = db.quizzes.filter(function (q) { return quizIds.indexOf(q.id) === -1; });
        db.folders = db.folders.filter(function (f) { return ids.indexOf(f.id) === -1; });
        commit();
        return null;
      });
    },
    quiz: function (id) {
      return callRepo('getQuiz', function () {
        var quiz = db.quizzes.find(function (q) { return q.id === id; });
        if (!quiz) throw new DataError('quiz_not_found', 'This quiz no longer exists.');
        var folder = db.folders.find(function (f) { return f.id === quiz.folder_id; });
        var questions = db.questions.filter(function (q) { return q.quiz_id === id; })
          .sort(function (a, b) { return a.position - b.position; })
          .map(function (q) {
            var opts = db.question_options.filter(function (o) { return o.question_id === q.id; })
              .sort(function (a, b) { return a.position - b.position; });
            return Object.assign({}, q, { options: opts });
          });
        var attempts = attemptsForQuiz(id).map(attemptPayload);
        return { quiz: quiz, folder: folder ? { id: folder.id, name: folder.name } : null, questions: questions, attempts: attempts };
      });
    },
    deleteQuiz: function (id) {
      return callRepo('deleteQuiz', function () {
        var quiz = db.quizzes.find(function (q) { return q.id === id; });
        if (!quiz) throw new DataError('quiz_not_found', 'This quiz no longer exists.');
        var questionIds = db.questions.filter(function (q) { return q.quiz_id === id; }).map(function (q) { return q.id; });
        db.attempts = db.attempts.filter(function (a) { return a.quiz_id !== id; });
        db.question_options = db.question_options.filter(function (o) { return questionIds.indexOf(o.question_id) === -1; });
        db.questions = db.questions.filter(function (q) { return q.quiz_id !== id; });
        db.quizzes = db.quizzes.filter(function (q) { return q.id !== id; });
        commit();
        return null;
      });
    },
    importQuizzes: function (folderId, quizzes) {
      return callRepo('importQuizzes', function () {
        var folder = db.folders.find(function (f) { return f.id === folderId; });
        if (!folder) throw new DataError('folder_not_found', 'Choose a folder before importing.');
        var incoming = Array.isArray(quizzes) ? quizzes : [];
        if (!incoming.length) throw new DataError('no_quizzes', 'There are no valid quizzes to import.');
        var imported = [];
        var skipped = [];
        incoming.forEach(function (raw) {
          if (!raw || !raw.title || !Array.isArray(raw.questions) || !raw.questions.length) {
            skipped.push({ title: (raw && raw.title) || 'Untitled', reason: 'Invalid quiz payload.' });
            return;
          }
          var quiz = {
            id: uuid(), folder_id: folderId, title: String(raw.title).trim(),
            subtitle: raw.subtitle || null, source_key: raw.source_key || null,
            created_at: new Date().toISOString()
          };
          db.quizzes.push(quiz);
          raw.questions.forEach(function (q, index) {
            var qid = uuid();
            db.questions.push({
              id: qid, quiz_id: quiz.id, prompt: q.prompt, type: q.type, marks: 1,
              position: index, difficulty: q.difficulty || null, explanation: q.explanation || null,
              unit: q.unit || null, numerical_answer: q.numerical_answer == null ? null : q.numerical_answer,
              tolerance: q.tolerance == null ? null : q.tolerance
            });
            (q.options || []).forEach(function (o, j) {
              db.question_options.push({ id: uuid(), question_id: qid, text: o.text, is_correct: o.is_correct ? 1 : 0, position: j });
            });
          });
          imported.push({ id: quiz.id, title: quiz.title });
        });
        commit();
        return { imported: imported, skipped: skipped };
      });
    },
    saveAttempt: function (payload) {
      return callRepo('saveAttempt', function () {
        var body = payload || {};
        var quiz = db.quizzes.find(function (q) { return q.id === body.quiz_id; });
        if (!quiz) throw new DataError('quiz_not_found', 'This quiz no longer exists.');
        var started = new Date(body.started_at);
        var ended = new Date(body.ended_at);
        if (isNaN(started.getTime()) || isNaN(ended.getTime())) {
          throw new DataError('invalid_time', 'The attempt timestamps are invalid.');
        }
        var duration = Math.max(0, ended.getTime() - started.getTime());
        var result = scoreAttempt(quiz.id, body.answers || {});
        var attempt = {
          id: uuid(), quiz_id: quiz.id, started_at: started.toISOString(), ended_at: ended.toISOString(),
          duration_ms: duration, score: result.score, max_score: result.max_score,
          answers_json: JSON.stringify(body.answers || {})
        };
        db.attempts.push(attempt);
        commit();
        return { attempt: attemptPayload(attempt), quiz: quiz };
      });
    },
    attempt: function (id) {
      return callRepo('getAttempt', function () {
        var attempt = db.attempts.find(function (a) { return a.id === id; });
        if (!attempt) throw new DataError('attempt_not_found', 'This attempt no longer exists.');
        var quiz = db.quizzes.find(function (q) { return q.id === attempt.quiz_id; });
        return { attempt: attemptPayload(attempt), quiz: quiz || null };
      });
    }
  };


  /* ============================================================
     5. App state + UI helpers
     ============================================================ */
  var renderToken = 0;
  var pendingToast = null;
  var importState = null;
  var attempt = null;
  var attemptPreload = null;
  var currentHash = '#/';
  var screenData = { folder: null, quiz: null };

  function shell(opts) {
    var o = opts || {};
    var back = o.back;
    var actions = o.actions || '';
    return '<div class="screen">' +
      '<header class="appbar">' +
        (back ? '<button class="icon-btn" data-action="nav" data-hash="' + esc(back) + '" aria-label="Back">' + icon('arrowLeft', 20) + '</button>' : '<span class="appbar-slot"></span>') +
        '<div class="appbar-title">' + esc(o.title || '') + '</div>' +
        '<div class="appbar-actions">' + actions + '</div>' +
      '</header>' +
      '<main class="content' + (o.flush ? ' flush' : '') + '">' + (o.content || '') + '</main>' +
      (o.footer || '') +
      (o.fab || '') +
    '</div>';
  }

  function setScreen(html) {
    var screen = document.getElementById('screen');
    screen.innerHTML = html;
  }

  function skeletonScreen(title, back, rows) {
    var body = '';
    for (var i = 0; i < (rows || 7); i++) {
      body += '<div class="skeleton-row"><div class="s-icon skeleton"></div><div class="s-lines"><div class="s-line mid skeleton"></div><div class="s-line short skeleton"></div></div></div>';
    }
    setScreen(shell({ title: title || '', back: back, content: body }));
  }

  function emptyState(iconName, title, text, actionLabel, actionHash, action, actionAttrs) {
    var actionHtml = '';
    if (actionLabel) {
      var attrs = actionHash
        ? 'data-action="nav" data-hash="' + esc(actionHash) + '"'
        : 'data-action="' + esc(action) + '"' + (actionAttrs ? ' ' + actionAttrs : '');
      actionHtml = '<button class="btn primary" ' + attrs + ' type="button">' + esc(actionLabel) + '</button>';
    }
    return '<div class="empty">' +
      '<div class="empty-icon">' + icon(iconName, 26) + '</div>' +
      '<h2>' + esc(title) + '</h2>' +
      '<p>' + esc(text) + '</p>' +
      actionHtml +
    '</div>';
  }

  function errorState(message, retryAction) {
    return '<div class="error-box">' +
      '<div class="error-icon">' + icon('alert', 26) + '</div>' +
      '<h2>Couldn\'t load this screen</h2>' +
      '<p>' + esc(message || 'Something went wrong. Please try again.') + '</p>' +
      '<button class="btn secondary" data-action="' + (retryAction || 'retry') + '" type="button">' + icon('refresh', 16) + ' Retry</button>' +
    '</div>';
  }

  function showToast(message, iconName) {
    var root = document.getElementById('toast-root');
    root.innerHTML = '<div class="toast">' + (iconName ? icon(iconName, 14) : '') + esc(message) + '</div>';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { root.innerHTML = ''; }, 2800);
  }

  function openOverlay(html, focusSelector) {
    document.getElementById('app').classList.add('sheet-open');
    var root = document.getElementById('overlay-root');
    root.innerHTML = '<div class="overlay"><div class="backdrop" data-action="close-sheet"></div>' + html + '</div>';
    if (focusSelector) {
      setTimeout(function () {
        var el = $(focusSelector);
        if (el) { el.focus(); if (el.select) el.select(); }
      }, 80);
    }
  }
  function closeOverlay() {
    document.getElementById('app').classList.remove('sheet-open');
    document.getElementById('overlay-root').innerHTML = '';
  }
  function sheet(content) {
    return '<div class="sheet" role="dialog" aria-modal="true"><div class="grabber"></div>' + content + '</div>';
  }

  /* ============================================================
     6. Routes / screens
     ============================================================ */
  function matchRoute(path) {
    var defs = [
      { re: /^\/$/, render: function (m, q, t) { return renderFolder({ id: 'root' }, q, t); } },
      { re: /^\/folders\/([^/]+)$/, render: function (m, q, t) { return renderFolder({ id: decodeURIComponent(m[1]) }, q, t); } },
      { re: /^\/quizzes\/([^/]+)$/, render: function (m, q, t) { return renderQuiz({ id: decodeURIComponent(m[1]) }, q, t); } },
      { re: /^\/quizzes\/([^/]+)\/attempt$/, render: function (m, q, t) { return renderAttempt({ id: decodeURIComponent(m[1]) }, q, t); }, attempt: true },
      { re: /^\/quizzes\/([^/]+)\/result\/([^/]+)$/, render: function (m, q, t) { return renderResult({ quizId: decodeURIComponent(m[1]), id: decodeURIComponent(m[2]) }, q, t); } },
      { re: /^\/attempts\/([^/]+)$/, render: function (m, q, t) { return renderResult({ id: decodeURIComponent(m[1]) }, q, t); } },
      { re: /^\/import$/, render: function (m, q, t) { return renderImport({}, q, t); } }
    ];
    for (var i = 0; i < defs.length; i++) {
      var m = path.match(defs[i].re);
      if (m) return { def: defs[i], match: m };
    }
    return null;
  }

  async function renderRoute() {
    var token = ++renderToken;
    closeOverlay();
    var raw = (location.hash || '#/').slice(1);
    if (!raw) raw = '/';
    var qIndex = raw.indexOf('?');
    var path = qIndex === -1 ? raw : raw.slice(0, qIndex);
    var query = new URLSearchParams(qIndex === -1 ? '' : raw.slice(qIndex + 1));
    currentHash = '#' + path + (qIndex === -1 ? '' : raw.slice(qIndex));
    syncDevScreen(path + (qIndex === -1 ? '' : raw.slice(qIndex)));
    var found = matchRoute(path);

    if (!found) {
      renderNotFound();
      flushToast();
      return;
    }

    if (path !== '/import') importState = null;

    await found.def.render(found.match, query, token);
    if (token !== renderToken) return;
    flushToast();
  }

  function flushToast() {
    if (pendingToast) {
      showToast(pendingToast.message, pendingToast.icon);
      pendingToast = null;
    }
  }

  function go(hash, toast, iconName) {
    closeOverlay();
    if (toast) pendingToast = { message: toast, icon: iconName || 'check' };
    var target = hash.charAt(0) === '#' ? hash : '#' + hash;
    if (location.hash === target) {
      renderRoute();
    } else {
      location.hash = target;
    }
  }

  function renderNotFound() {
    setScreen(shell({
      title: 'Not found',
      back: '/',
      content: emptyState('alert', 'This page doesn\'t exist', 'The link may be old, or the screen was moved. Your library is still where you left it.', 'Go to library', '/'),
      fab: ''
    }));
  }

  function rootHero(folders, stats) {
    var quizCount = stats && typeof stats.quizzes === 'number' ? stats.quizzes : 0;
    return '<section class="hero">' +
      '<div class="eyebrow">Library</div>' +
      '<h1 class="display">Your library</h1>' +
      '<p class="hero-sub">Folders and quizzes, kept local and in order.</p>' +
      '<div class="hero-meta"><span>' + plural(folders.length, 'folder') + '</span><span class="dot-sep"></span><span>' + plural(quizCount, 'quiz', 'quizzes') + '</span></div>' +
    '</section>';
  }

  function breadcrumb(path) {
    if (!path || !path.length) return '';
    var out = '<nav class="crumbs" aria-label="Breadcrumb"><button class="crumb" data-action="nav" data-hash="/" type="button">All folders</button>';
    path.forEach(function (f, i) {
      out += '<span class="crumb-sep">' + icon('chevronRight', 12) + '</span>';
      out += '<button class="crumb' + (i === path.length - 1 ? ' current' : '') + '" data-action="nav" data-hash="/folders/' + encodeURIComponent(f.id) + '" type="button">' + esc(f.name) + '</button>';
    });
    out += '</nav>';
    return out;
  }

  function folderRow(f) {
    var bits = [];
    if (f.folder_count) bits.push(plural(f.folder_count, 'folder'));
    if (f.quiz_count) bits.push(plural(f.quiz_count, 'quiz', 'quizzes'));
    var meta = bits.length ? bits.join(' · ') : 'Empty';
    return '<div class="row">' +
      '<button class="row-hit" data-action="nav" data-hash="/folders/' + encodeURIComponent(f.id) + '" type="button">' +
        '<span class="row-icon">' + icon('folder', 20) + '</span>' +
        '<span class="row-main"><span class="row-title">' + esc(f.name) + '</span><span class="row-meta">' + meta + '</span></span>' +
        '<span class="row-end">' + icon('chevronRight', 17) + '</span>' +
      '</button>' +
      '<button class="row-more" data-action="folder-actions" data-id="' + f.id + '" aria-label="Folder options" type="button">' + icon('more', 18) + '</button>' +
    '</div>';
  }

  function quizRow(q) {
    var meta = plural(q.question_count, 'question') + ' · ' + (q.attempt_count ? plural(q.attempt_count, 'attempt') : 'No attempts');
    var last = q.last_attempt;
    return '<div class="row">' +
      '<button class="row-hit" data-action="nav" data-hash="/quizzes/' + encodeURIComponent(q.id) + '" type="button">' +
        '<span class="row-icon quiz">' + icon('file', 19) + '</span>' +
        '<span class="row-main"><span class="row-title">' + esc(q.title) + '</span><span class="row-meta">' + meta + '</span></span>' +
        '<span class="row-end">' + (last ? '<span class="score-badge ' + scoreClass(pct(last.score, last.max_score)) + '">' + last.score + '/' + last.max_score + '</span>' : '') + icon('chevronRight', 17) + '</span>' +
      '</button>' +
      '<button class="row-more" data-action="quiz-actions" data-id="' + q.id + '" aria-label="Quiz options" type="button">' + icon('more', 18) + '</button>' +
    '</div>';
  }

  async function renderFolder(params, query, token) {
    var id = params.id || 'root';
    skeletonScreen(id === 'root' ? 'All folders' : 'Folder', id === 'root' ? null : '/', 7);
    try {
      var data = await repo.folderContents(id);
      if (token !== renderToken) return;
      screenData.folder = data;
      screenData.quiz = null;
      var folder = data.folder;
      var folders = data.folders || [];
      var quizzes = data.quizzes || [];
      var title = folder ? folder.name : 'All folders';
      var content = '';

      if (folder) {
        content += breadcrumb(data.path) +
          '<div class="folder-summary"><span>' + plural(folders.length, 'folder') + '</span><span class="dot-sep"></span><span>' + plural(quizzes.length, 'quiz', 'quizzes') + '</span></div>';
      } else {
        content += rootHero(folders, data.stats);
      }

      if (folders.length) {
        content += '<section class="list-section"><div class="section-head"><span>Folders</span><span class="section-count">' + folders.length + '</span></div><div class="rows">' + folders.map(folderRow).join('') + '</div></section>';
      }
      if (quizzes.length) {
        content += '<section class="list-section"><div class="section-head"><span>Quizzes</span><span class="section-count">' + quizzes.length + '</span></div><div class="rows">' + quizzes.map(quizRow).join('') + '</div></section>';
      }
      if (!folders.length && !quizzes.length) {
        var empty = folder
          ? emptyState('folder', 'This folder is empty', 'Create a sub-folder or import a quiz to get started.', 'New folder', null, 'new-folder', 'data-parent="' + folder.id + '"')
          : emptyState('folderPlus', 'No folders yet', 'Folders keep related quizzes together. Create your first one to begin.', 'New folder', null, 'new-folder', 'data-parent=""');
        content += empty;
      }

      var actions = '<button class="icon-btn" data-action="retry" aria-label="Refresh">' + icon('refresh', 19) + '</button>';
      if (folder) actions += '<button class="icon-btn" data-action="folder-actions" data-id="' + folder.id + '" aria-label="Folder options">' + icon('more', 19) + '</button>';

      setScreen(shell({
        title: title,
        back: folder ? (folder.parent_folder_id ? '/folders/' + encodeURIComponent(folder.parent_folder_id) : '/') : null,
        actions: actions,
        content: content,
        fab: '<button class="fab" data-action="fab" data-folder="' + (folder ? folder.id : 'root') + '" aria-label="Add" type="button">' + icon('plus', 24) + '</button>'
      }));
    } catch (e) {
      if (token !== renderToken) return;
      setScreen(shell({
        title: id === 'root' ? 'All folders' : 'Folder',
        back: id === 'root' ? null : '/',
        content: errorState(e.message, 'retry'),
        banner: true
      }));
    }
  }

  function typeCounts(questions) {
    var c = { mcq: 0, msq: 0, numerical: 0 };
    questions.forEach(function (q) { if (c[q.type] != null) c[q.type]++; });
    return c;
  }
  function typeLabel(type) { return type === 'mcq' ? 'MCQ' : type === 'msq' ? 'MSQ' : 'Numerical'; }

  function attemptRow(a, quiz) {
    var p = pct(a.score, a.max_score);
    return '<button class="attempt-row" data-action="nav" data-hash="/attempts/' + encodeURIComponent(a.id) + '" type="button">' +
      '<span class="score-badge ' + scoreClass(p) + '">' + a.score + '/' + a.max_score + '</span>' +
      '<span class="attempt-main"><span class="attempt-score">' + p + '%</span><span class="attempt-meta">' + formatDurationLong(a.duration_ms) + ' · ' + formatDate(a.started_at) + '</span></span>' +
      '<span class="chev">' + icon('chevronRight', 16) + '</span>' +
    '</button>';
  }

  async function renderQuiz(params, query, token) {
    skeletonScreen('Quiz', '/', 6);
    try {
      var data = await repo.quiz(params.id);
      if (token !== renderToken) return;
      screenData.quiz = data;
      screenData.folder = null;
      var quiz = data.quiz;
      var folder = data.folder;
      var questions = data.questions || [];
      var attempts = data.attempts || [];
      var counts = typeCounts(questions);
      var totalMarks = questions.reduce(function (s, q) { return s + (q.marks || 1); }, 0);
      var chips = '<span class="chip">' + plural(questions.length, 'question') + '</span><span class="chip">' + totalMarks + ' marks</span>';
      if (counts.mcq) chips += '<span class="chip">' + counts.mcq + ' MCQ</span>';
      if (counts.msq) chips += '<span class="chip">' + counts.msq + ' MSQ</span>';
      if (counts.numerical) chips += '<span class="chip">' + counts.numerical + ' Numerical</span>';

      var content = '<section class="detail-hero">' +
        '<div class="eyebrow">' + esc(folder ? folder.name : 'Quiz') + '</div>' +
        '<h1 class="display">' + esc(quiz.title) + '</h1>' +
        (quiz.subtitle ? '<p class="detail-sub">' + esc(quiz.subtitle) + '</p>' : '') +
        '<div class="chips">' + chips + '</div>' +
      '</section>' +
      '<button class="btn primary wide" data-action="nav" data-hash="/quizzes/' + encodeURIComponent(quiz.id) + '/attempt" type="button">' + icon('play', 18) + ' Start attempt</button>' +
      '<p class="center-hint">Unlimited attempts · the timer starts on Start</p>' +
      '<section class="list-section"><div class="section-head"><span>Attempts</span><span class="section-count">' + attempts.length + '</span></div>' +
        (attempts.length
          ? '<div class="rows">' + attempts.map(function (a) { return attemptRow(a, quiz); }).join('') + '</div>'
          : '<div class="card" style="margin-top:6px;text-align:center;padding:22px 16px;"><div class="muted" style="font-size:12px;">Your first score will appear here after you press End.</div></div>') +
      '</section>';

      setScreen(shell({
        title: 'Quiz',
        back: '/folders/' + encodeURIComponent(quiz.folder_id),
        actions: '<button class="icon-btn" data-action="quiz-actions" data-id="' + quiz.id + '" aria-label="Quiz options">' + icon('more', 19) + '</button>',
        content: content
      }));
    } catch (e) {
      if (token !== renderToken) return;
      setScreen(shell({ title: 'Quiz', back: '/', content: errorState(e.message, 'retry') }));
    }
  }

  function questionCard(q, index) {
    var selected = attempt.answers[q.id];
    var options = '';
    if (q.type === 'numerical') {
      var val = typeof selected === 'string' ? selected : '';
      options = '<div class="numeric-wrap"><input class="numeric-input" data-numeric data-qid="' + q.id + '" inputmode="decimal" autocomplete="off" value="' + esc(val) + '" placeholder="Enter a number"' + (q.unit ? ' aria-label="Answer in ' + esc(q.unit) + '"' : '') + '>' + (q.unit ? '<span class="unit">' + esc(q.unit) + '</span>' : '') + '</div>';
    } else {
      options = '<div class="options ' + q.type + '">' + q.options.map(function (o) {
        var isSelected = q.type === 'mcq'
          ? selected === o.id
          : (Array.isArray(selected) && selected.indexOf(o.id) !== -1);
        return '<button class="option ' + q.type + (isSelected ? ' selected' : '') + '" data-action="' + (q.type === 'mcq' ? 'choose-mcq' : 'toggle-msq') + '" data-qid="' + q.id + '" data-oid="' + o.id + '" aria-pressed="' + isSelected + '" type="button">' +
          '<span class="control">' + (q.type === 'mcq' ? '<span class="dot"></span>' : icon('check', 12)) + '</span>' +
          '<span class="option-text">' + rich(o.text) + '</span>' +
        '</button>';
      }).join('') + '</div>';
    }
    return '<article class="question-card" data-question="' + q.id + '">' +
      '<div class="question-head"><span class="question-num">' + pad(index + 1) + '</span><span class="type-chip ' + q.type + '">' + typeLabel(q.type) + '</span><span class="marks">' + (q.marks || 1) + ' mark</span></div>' +
      '<h2 class="question-prompt">' + rich(q.prompt) + '</h2>' +
      options +
    '</article>';
  }

  function attemptAnsweredCount() {
    if (!attempt) return 0;
    return attempt.questions.filter(function (q) {
      var a = attempt.answers[q.id];
      if (q.type === 'numerical') return String(a == null ? '' : a).trim() !== '';
      if (q.type === 'msq') return Array.isArray(a) && a.length > 0;
      return !!a;
    }).length;
  }

  function updateAttemptChrome() {
    if (!attempt) return;
    var answered = attemptAnsweredCount();
    var total = attempt.questions.length;
    var progress = total ? Math.round((answered / total) * 100) : 0;
    var pc = document.getElementById('progress-count');
    if (pc) pc.textContent = answered + ' / ' + total + ' answered';
    var bar = document.getElementById('progress-bar');
    if (bar) bar.style.width = progress + '%';
    var fa = document.getElementById('footer-answered');
    if (fa) fa.textContent = String(answered);
    var timer = document.getElementById('attempt-timer');
    if (timer) timer.textContent = formatClock(Date.now() - attempt.startedAt.getTime());
  }

  function startTimer() {
    stopTimer();
    attempt.timerId = setInterval(function () {
      if (!attempt || !attempt.running) return;
      var timer = document.getElementById('attempt-timer');
      if (timer) timer.textContent = formatClock(Date.now() - attempt.startedAt.getTime());
    }, 1000);
    updateAttemptChrome();
  }
  function stopTimer() {
    if (attempt && attempt.timerId) {
      clearInterval(attempt.timerId);
      attempt.timerId = null;
    }
  }

          '<div class="score-ring-text"><span class="score-pct">' + p + '%</span><span class="score-frac">' + a.score + ' / ' + a.max_score + '</span></div>' +

  function fileCard(f) {
    var status = f.status === 'valid' ? '<span class="status-chip valid">Valid</span>' : f.status === 'reading' ? '<span class="status-chip reading">Reading</span>' : '<span class="status-chip invalid">Needs fixes</span>';
    var body = '';
    if (f.status === 'valid' && f.quiz) {
      var counts = typeCounts(f.quiz.questions);
      var marks = f.quiz.questions.reduce(function (s, q) { return s + (q.marks || 1); }, 0);
      var typeBits = [];
      if (counts.mcq) typeBits.push(counts.mcq + ' MCQ');
      if (counts.msq) typeBits.push(counts.msq + ' MSQ');
      if (counts.numerical) typeBits.push(counts.numerical + ' Numerical');
      body = '<div class="file-title">' + esc(f.quiz.title || 'Untitled quiz') + '</div>' +
        '<div class="file-meta">' + plural(f.quiz.questions.length, 'question') + ' · ' + marks + ' marks' + (typeBits.length ? ' · ' + typeBits.join(' · ') : '') + '</div>' +
        (f.repaired ? '<div class="repair-note">Backslashes were repaired so the math stays intact. Regenerate this file as valid JSON when you can.</div>' : '');
    } else if (f.status === 'invalid') {
      body = '<ul class="file-errors">' + f.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul>';
    } else {
      body = '<div class="file-meta">Reading and validating…</div>';
    }
    return '<div class="file-card ' + f.status + '">' +
      '<div class="file-head"><span class="file-icon">' + icon('file', 16) + '</span><span class="file-name">' + esc(f.name) + '<span class="file-size">' + formatBytes(f.size) + '</span></span>' + status +
        (f.status === 'reading' ? '' : '<button class="icon-btn" data-action="remove-file" data-id="' + f.id + '" aria-label="Remove file">' + icon('x', 16) + '</button>') +
      '</div>' + body +
    '</div>';
  }

  async function renderImport(params, query, token) {
    var folderId = query.get('folder') || '';
    if (!folderId) {
      go('/', 'Choose a folder before importing.', 'alert');
      return;
    }
    var sampleParam = query.get('sample');
    if (!importState || importState.folderId !== folderId) {
      importState = { folderId: folderId, files: [], reading: false, importing: false, folder: null, autoSample: sampleParam };
    } else if (sampleParam) {
      importState.autoSample = sampleParam;
    }

    setScreen(shell({ title: 'Import', back: '/folders/' + encodeURIComponent(folderId), content: '<div class="skeleton-row"><div class="s-icon skeleton"></div><div class="s-lines"><div class="s-line mid skeleton"></div><div class="s-line short skeleton"></div></div></div>' }));

    try {
      var data = await repo.folderContents(folderId);
      if (token !== renderToken) return;
      if (!data.folder) throw new Error('Choose a folder before importing.');
      importState.folder = data.folder;

      if (importState.autoSample && !importState.files.length) {
        var kind = importState.autoSample;
        importState.autoSample = null;
        history.replaceState(null, '', '#/import?folder=' + encodeURIComponent(folderId));
        addTextFile(kind === 'invalid' ? 'broken-quiz.json' : 'quiz.json', kind === 'invalid' ? INVALID_SAMPLE : SAMPLE_TEXT);
      }

      drawImport();
    } catch (e) {
      if (token !== renderToken) return;
      setScreen(shell({ title: 'Import', back: '/folders/' + encodeURIComponent(folderId), content: errorState(e.message, 'retry') }));
    }
  }

  function drawImport() {
    if (!importState) return;
    var st = importState;
    var folder = st.folder;
    var valid = st.files.filter(function (f) { return f.status === 'valid'; });
    var invalid = st.files.filter(function (f) { return f.status === 'invalid'; });
    var totalQuestions = valid.reduce(function (s, f) { return s + (f.quiz ? f.quiz.questions.length : 0); }, 0);
    var totalSize = st.files.reduce(function (s, f) { return s + f.size; }, 0);

    var content = '<div class="import-target">' + icon('folder', 16) + '<span>Import into <strong>' + esc(folder ? folder.name : 'folder') + '</strong></span></div>';

    if (!st.files.length) {
      content += '<div class="dropzone" id="dropzone">' +
        '<div class="drop-icon">' + icon('upload', 24) + '</div>' +
        '<h2>Choose JSON files</h2>' +
        '<p>One or more quiz files · .json · max 5 MB each</p>' +
        '<button class="btn primary" data-action="choose-files" type="button">Choose files</button>' +
        '<div class="drop-links"><button class="text-btn" data-action="load-sample" type="button">Try the sample quiz</button></div>' +
      '</div>' +
      '<input type="file" id="file-input" accept=".json,application/json" multiple hidden>';
    } else {
      content += '<div class="dropzone" id="dropzone" style="padding:18px 14px;">' +
        '<div style="display:flex;align-items:center;gap:10px;text-align:left;">' +
          '<div class="drop-icon" style="width:38px;height:38px;border-radius:11px;margin:0;">' + icon('upload', 18) + '</div>' +
          '<div style="flex:1;"><div style="font-size:13px;font-weight:650;">Add more files</div><div class="muted small">Drop files here or choose again</div></div>' +
          '<button class="btn secondary small" data-action="choose-files" type="button">Choose</button>' +

      '</div>' +
      '<input type="file" id="file-input" accept=".json,application/json" multiple hidden>' +
      '<div class="file-list">' + st.files.map(fileCard).join('') + '</div>' +
      '<div class="batch-summary"><span>' + (valid.length ? valid.length + ' valid' : 'No valid files') + (invalid.length ? ' · ' + invalid.length + ' skipped' : '') + '</span><span>' + plural(totalQuestions, 'question') + (totalSize ? ' · ' + formatBytes(totalSize) : '') + '</span></div>';
    }

    if (st.reading) {
      content += '<div class="card" style="margin-top:12px;display:flex;align-items:center;gap:10px;"><span class="spinner" style="width:16px;height:16px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;"></span><span class="small muted">Reading and validating files…</span></div>';
    }

    var footer = '';
    if (st.files.length) {
      footer = '<div class="footer import-footer"><div class="footer-progress">' + plural(st.files.length, 'file') + '</div>' +
        '<button class="btn primary" data-action="import-files" type="button"' + (valid.length && !st.reading && !st.importing ? '' : ' disabled') + '>' +
        (st.importing ? '<span class="spinner"></span> Importing…' : 'Import ' + valid.length + ' quiz' + (valid.length === 1 ? '' : 'zes')) +
        '</button></div>';
    }

    setScreen(shell({ title: 'Import', back: '/folders/' + encodeURIComponent(st.folderId), content: content, footer: footer }));
    setUpDropzone();
  }

  function setUpDropzone() {
    var dz = document.getElementById('dropzone');
    var input = document.getElementById('file-input');
    if (!dz || !input) return;
    dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('dragging'); });
    dz.addEventListener('dragleave', function () { dz.classList.remove('dragging'); });
    dz.addEventListener('drop', function (e) {
      e.preventDefault();
      dz.classList.remove('dragging');
      if (e.dataTransfer && e.dataTransfer.files) addFiles(Array.prototype.slice.call(e.dataTransfer.files));
    });
    input.addEventListener('change', function () {
      addFiles(Array.prototype.slice.call(input.files || []));
      input.value = '';
    });
    dz.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;
      input.click();
    });
  }

  function addTextFile(name, text) {
    if (!importState) return;
    importState.files = importState.files.filter(function (f) { return f.name !== name; });
    var f = {
      id: uuid(), name: name, size: text.length, status: 'reading', quiz: null, errors: [], repaired: false, _text: text
    };
    importState.files.push(f);
    importState.reading = true;
    drawImport();
    setTimeout(function () {
      var result = validateFileText(name, text, f.size);
      f.status = result.status;
      f.quiz = result.quiz;
      f.errors = result.errors;
      f.repaired = result.repaired;
      importState.reading = importState.files.some(function (x) { return x.status === 'reading'; });
      drawImport();
    }, 450);
  }

  async function addFiles(files) {
    if (!importState) return;
    if (!files.length) return;
    if (files.length + importState.files.length > 50) {
      showToast('You can add up to 50 files at a time.', 'alert');
      files = files.slice(0, Math.max(0, 50 - importState.files.length));
    }
    var total = importState.files.reduce(function (s, f) { return s + f.size; }, 0) + files.reduce(function (s, f) { return s + f.size; }, 0);
    if (total > 20 * 1024 * 1024) {
      showToast('The batch is larger than 20 MB.', 'alert');
      return;
    }
    for (var i = 0; i < files.length; i++) {
      var file = files[i];
      var f = { id: uuid(), name: file.name, size: file.size, status: 'reading', quiz: null, errors: [], repaired: false };
      importState.files.push(f);
      if (file.size > 5 * 1024 * 1024) {
        f.status = 'invalid';
        f.errors = ['This file is larger than 5 MB.'];
        continue;
      }
      try {
        var text = await file.text();
        var result = validateFileText(file.name, text, file.size);
        f.status = result.status;
        f.quiz = result.quiz;
        f.errors = result.errors;
        f.repaired = result.repaired;
      } catch (e) {
        f.status = 'invalid';
        f.errors = ['This file could not be read.'];
      }
    }
    importState.reading = false;
    drawImport();
  }

  function validateFileText(name, text, size) {
    if (size > 5 * 1024 * 1024) return { status: 'invalid', errors: ['This file is larger than 5 MB.'], quiz: null, repaired: false };
    var parsed;
    try {
      parsed = parseJsonLoose(text);
    } catch (e) {
      return { status: 'invalid', errors: [e.message], quiz: null, repaired: false };
    }
    var canonical = canonicalizeQuiz(parsed.value);
    if (canonical.errors.length) {
      return { status: 'invalid', errors: canonical.errors, quiz: canonical.quiz, repaired: parsed.repaired };
    }
    return { status: 'valid', errors: [], quiz: canonical.quiz, repaired: parsed.repaired };
  }

  async function importFiles() {
    if (!importState || importState.importing) return;
    var valid = importState.files.filter(function (f) { return f.status === 'valid'; });
    if (!valid.length) {
      showToast('There are no valid quizzes to import.', 'alert');
      return;
    }
    importState.importing = true;
    drawImport();
    try {
      var result = await repo.importQuizzes(importState.folderId, valid.map(function (f) { return f.quiz; }));
      var imported = result.imported || [];
      var skipped = (result.skipped || []).length + importState.files.filter(function (f) { return f.status === 'invalid'; }).length;
      var folderId = importState.folderId;
      importState = null;
      if (imported.length === 1) {
        go('/quizzes/' + imported[0].id, 'Quiz imported' + (skipped ? ' · ' + skipped + ' skipped' : ''), 'check');
      } else {
        go('/folders/' + folderId, imported.length + ' quizzes imported' + (skipped ? ' · ' + skipped + ' skipped' : ''), 'check');
      }
    } catch (e) {
      importState.importing = false;
      drawImport();
      showToast(e.message || 'The import failed. Please try again.', 'alert');
    }
  }

  async function folderInfo(folderId) {
    if (screenData.folder) {
      if (screenData.folder.folder && screenData.folder.folder.id === folderId) {
        return { name: screenData.folder.folder.name, folders: screenData.folder.folders.length, quizzes: screenData.folder.quizzes.length };
      }
      var row = (screenData.folder.folders || []).find(function (f) { return f.id === folderId; });
      if (row) return { name: row.name, folders: row.folder_count, quizzes: row.quiz_count };
    }
    try {
      var d = await repo.folderContents(folderId);
      return d.folder ? { name: d.folder.name, folders: d.folders.length, quizzes: d.quizzes.length } : null;
    } catch (e) { return null; }
  }

  async function quizInfo(quizId) {
    if (screenData.quiz && screenData.quiz.quiz.id === quizId) {
      return {
        quiz: screenData.quiz.quiz,
        question_count: screenData.quiz.questions.length,
        attempt_count: screenData.quiz.attempts.length
      };
    }
    if (screenData.folder) {
      var row = (screenData.folder.quizzes || []).find(function (q) { return q.id === quizId; });
      if (row) return { quiz: { id: row.id, title: row.title, folder_id: row.folder_id }, question_count: row.question_count, attempt_count: row.attempt_count };
    }
    try {
      var d = await repo.quiz(quizId);
      return { quiz: d.quiz, question_count: d.questions.length, attempt_count: d.attempts.length };
    } catch (e) { return null; }
  }

  }

  function fabSheet(folderId) {
    var folder = null;
    if (screenData.folder) {
      if (screenData.folder.folder && screenData.folder.folder.id === folderId) {
        folder = screenData.folder.folder;
      } else {
        folder = (screenData.folder.folders || []).find(function (f) { return f.id === folderId; }) || null;
      }
    }
    var content = '<h3>Add to ' + esc(folder ? folder.name : 'library') + '</h3>' +
      '<p class="sheet-sub">' + (folder ? 'Create a sub-folder or import one or more quiz files.' : 'Create a top-level folder to hold your quizzes.') + '</p>' +
      '<div class="sheet-actions row-actions">' +
        '<button class="action-row" data-action="new-folder" data-parent="' + (folder ? folder.id : '') + '" type="button">' + icon('folderPlus', 18) + ' New folder</button>' +
        (folder ? '<button class="action-row" data-action="nav" data-hash="/import?folder=' + encodeURIComponent(folder.id) + '" type="button">' + icon('upload', 18) + ' Import quizzes</button>' : '') +
      '</div>';
    openOverlay(sheet(content));
  }

  function newFolderSheet(parentId) {
    var parent = null;
    if (parentId && screenData.folder) {
      if (screenData.folder.folder && screenData.folder.folder.id === parentId) parent = screenData.folder.folder;
      else parent = (screenData.folder.folders || []).find(function (f) { return f.id === parentId; }) || null;
    }
    openOverlay(sheet(
      '<h3>New folder</h3>' +
      '<p class="sheet-sub">' + (parent ? 'Inside ' + esc(parent.name) : 'At the top level of your library') + '</p>' +
      '<form data-form="new-folder" data-parent="' + esc(parentId || '') + '">' +
        '<div class="field"><label for="folder-name">Folder name</label><input class="input" id="folder-name" name="name" maxlength="60" autocomplete="off" placeholder="e.g. Organic Chemistry"><div class="field-error" id="folder-error"></div></div>' +
        '<div class="dialog-actions"><button class="btn ghost" type="button" data-action="close-sheet">Cancel</button><button class="btn primary" type="submit">Create</button></div>' +
      '</form>'
    ), '#folder-name');
  }

  function renameFolderSheet(folderId) {
    var f = null;
    if (screenData.folder) {
      if (screenData.folder.folder && screenData.folder.folder.id === folderId) f = screenData.folder.folder;
      else f = (screenData.folder.folders || []).find(function (x) { return x.id === folderId; }) || null;
    }
    if (!f) { showToast('This folder is no longer available.', 'alert'); return; }
    openOverlay(sheet(
      '<h3>Rename folder</h3>' +
      '<p class="sheet-sub">Give the folder a clear, short name.</p>' +
      '<form data-form="rename-folder" data-id="' + f.id + '">' +
        '<div class="field"><label for="folder-name">Folder name</label><input class="input" id="folder-name" name="name" maxlength="60" autocomplete="off" value="' + esc(f.name) + '"><div class="field-error" id="folder-error"></div></div>' +
        '<div class="dialog-actions"><button class="btn ghost" type="button" data-action="close-sheet">Cancel</button><button class="btn primary" type="submit">Save</button></div>' +
      '</form>'
    ), '#folder-name');
  }

  async function deleteFolderSheet(folderId) {
    try {
      var preview = await repo.folderDeletePreview(folderId);
      openOverlay(sheet(
        '<h3>Delete "' + esc(preview.folder.name) + '"?</h3>' +
        '<p class="sheet-sub">This removes the folder and everything inside it. This cannot be undone.</p>' +
        '<div class="danger-copy">' + plural(preview.folders, 'sub-folder') + ' · ' + plural(preview.quizzes, 'quiz', 'quizzes') + ' · ' + plural(preview.attempts, 'stored attempt') + '</div>' +
        '<div class="dialog-actions"><button class="btn ghost" type="button" data-action="close-sheet">Cancel</button><button class="btn danger" data-action="confirm-delete-folder" data-id="' + folderId + '" data-parent="' + esc(preview.folder.parent_folder_id || '') + '" type="button">Delete folder</button></div>'
      ));
    } catch (e) {
      showToast(e.message || 'Could not load the delete preview.', 'alert');
    }
  }

  async function deleteQuizSheet(quizId) {
    var info = await quizInfo(quizId);
    if (!info) { showToast('This quiz is no longer available.', 'alert'); return; }
    openOverlay(sheet(
      '<h3>Delete "' + esc(info.quiz.title) + '"?</h3>' +
      '<p class="sheet-sub">The quiz and its history will be removed. This cannot be undone.</p>' +
      '<div class="danger-copy">' + plural(info.question_count, 'question') + ' · ' + plural(info.attempt_count, 'stored attempt') + '</div>' +
      '<div class="dialog-actions"><button class="btn ghost" type="button" data-action="close-sheet">Cancel</button><button class="btn danger" data-action="confirm-delete-quiz" data-id="' + quizId + '" data-folder="' + esc(info.quiz.folder_id || '') + '" type="button">Delete quiz</button></div>'
    ));
  }

  function endAttemptSheet() {
    if (!attempt) return;
    var answered = attemptAnsweredCount();
    var total = attempt.questions.length;
    var unanswered = total - answered;
    openOverlay(sheet(
      '<h3>End this attempt?</h3>' +
      '<p class="sheet-sub">You answered ' + answered + ' of ' + total + ' questions.' + (unanswered ? ' ' + unanswered + ' unanswered question' + (unanswered === 1 ? '' : 's') + ' will score zero.' : '') + '</p>' +
      '<div class="dialog-actions" style="flex-direction:column;">' +
        '<button class="btn primary wide" data-action="confirm-end" type="button">End and see result</button>' +
        '<button class="btn ghost wide" data-action="close-sheet" type="button">Keep going</button>' +
      '</div>'
    ));
  }

  function discardAttemptSheet() {
    openOverlay(sheet(
      '<h3>Discard this attempt?</h3>' +
      '<p class="sheet-sub">Your answers will not be saved, and no history row will be created.</p>' +
      '<div class="dialog-actions" style="flex-direction:column;">' +
        '<button class="btn danger wide" data-action="confirm-discard" type="button">Discard attempt</button>' +
        '<button class="btn ghost wide" data-action="close-sheet" type="button">Keep going</button>' +
      '</div>'
    ));
  }

  function clearAttempt() {
    if (!attempt) return;
    stopTimer();
    attempt = null;
    attemptPreload = null;
  }

  async function confirmEndAttempt() {
    if (!attempt) return;
    var btn = $('[data-action="confirm-end"]');
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Saving…'; }
    var quizId = attempt.quiz.id;
    var payload = {
      quiz_id: quizId,
      started_at: attempt.startedAt.toISOString(),
      ended_at: new Date().toISOString(),
      answers: attempt.answers
    };
    try {
      var result = await repo.saveAttempt(payload);
      clearAttempt();
      closeOverlay();
      go('/quizzes/' + encodeURIComponent(quizId) + '/result/' + encodeURIComponent(result.attempt.id), 'Attempt saved', 'check');
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = 'End and see result'; }
      showToast(e.message || 'Could not save the attempt. Try again.', 'alert');
    }
  }

  function confirmDiscard() {
    if (!attempt) return;
    var quizId = attempt.quiz.id;
    clearAttempt();
    closeOverlay();
    go('/quizzes/' + encodeURIComponent(quizId));
  }

  function attemptExit() {
    if (!attempt) return;
    attempt.pendingExitHash = '/quizzes/' + encodeURIComponent(attempt.quiz.id);
    discardAttemptSheet();
  }

  /* ============================================================
     8. Events
     ============================================================ */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var action = el.getAttribute('data-action');
    var id = el.getAttribute('data-id');
    var hash = el.getAttribute('data-hash');

    switch (action) {
      case 'nav':
        if (hash) go(hash);
        break;
      case 'close-sheet':
        closeOverlay();
        break;
      case 'retry':
        closeOverlay();
        renderRoute();
        break;
      case 'fab':
        closeOverlay();
        fabSheet(el.getAttribute('data-folder'));
        break;
      case 'fab-from-empty':
        closeOverlay();
        fabSheet(el.getAttribute('data-folder') || 'root');
        break;
      case 'folder-actions':
        closeOverlay();
        folderActions(id);
        break;
      case 'quiz-actions':
        closeOverlay();
        quizActions(id);
        break;
      case 'new-folder':
        closeOverlay();
        newFolderSheet(el.getAttribute('data-parent') || '');
        break;
      case 'rename-folder':
        closeOverlay();
        renameFolderSheet(id);
        break;
      case 'delete-folder':
        closeOverlay();
        deleteFolderSheet(id);
        break;
      case 'delete-quiz':
        closeOverlay();
        deleteQuizSheet(id);
        break;
      case 'confirm-delete-folder':
        (async function () {
          el.disabled = true; el.innerHTML = '<span class="spinner"></span> Deleting…';
          try {
            var parent = el.getAttribute('data-parent') || null;
            await repo.deleteFolder(id);
            closeOverlay();
            go(parent ? '/folders/' + encodeURIComponent(parent) : '/', 'Folder deleted', 'trash');
          } catch (err) { el.disabled = false; el.textContent = 'Delete folder'; showToast(err.message, 'alert'); }
        })();
        break;
      case 'confirm-delete-quiz':
        (async function () {
          el.disabled = true; el.innerHTML = '<span class="spinner"></span> Deleting…';
          try {
            var folderId = el.getAttribute('data-folder') || null;
            await repo.deleteQuiz(id);
            closeOverlay();
            go(folderId ? '/folders/' + encodeURIComponent(folderId) : '/', 'Quiz deleted', 'trash');
          } catch (err) { el.disabled = false; el.textContent = 'Delete quiz'; showToast(err.message, 'alert'); }
        })();
        break;
      case 'begin-attempt':
        beginAttempt();
        break;
      case 'attempt-exit':
        attemptExit();
        break;
      case 'end-attempt':
        openOverlay('');
        endAttemptSheet();
        break;
      case 'confirm-end':
        confirmEndAttempt();
        break;
      case 'confirm-discard':
        confirmDiscard();
        break;
      case 'choose-files':
        closeOverlay();
        var fi = document.getElementById('file-input');
        if (fi) fi.click();
        break;
      case 'load-sample':
        addTextFile('quiz.json', SAMPLE_TEXT);
        break;
      case 'remove-file':
        if (importState) {
          importState.files = importState.files.filter(function (f) { return f.id !== id; });
          drawImport();
        }
        break;
      case 'import-files':
        importFiles();
        break;
      case 'choose-mcq':
        if (!attempt) return;
        attempt.answers[el.getAttribute('data-qid')] = el.getAttribute('data-oid');
        var qid = el.getAttribute('data-qid');
        var card = el.closest('[data-question]');
        if (card) {
          $$('.option', card).forEach(function (o) {
            o.classList.toggle('selected', o.getAttribute('data-oid') === el.getAttribute('data-oid'));
            o.setAttribute('aria-pressed', o === el ? 'true' : 'false');
          });
        }
        updateAttemptChrome();
        break;
      case 'toggle-msq':
        if (!attempt) return;
        var mqid = el.getAttribute('data-qid');
        var oid = el.getAttribute('data-oid');
        var arr = Array.isArray(attempt.answers[mqid]) ? attempt.answers[mqid].slice() : [];
        var pos = arr.indexOf(oid);
        if (pos === -1) arr.push(oid); else arr.splice(pos, 1);
        attempt.answers[mqid] = arr;
        el.classList.toggle('selected', arr.indexOf(oid) !== -1);
        el.setAttribute('aria-pressed', arr.indexOf(oid) !== -1 ? 'true' : 'false');
        updateAttemptChrome();
        break;
      default:
        break;
    }
  });

  document.addEventListener('input', function (e) {
    var input = e.target.closest('[data-numeric]');
    if (!input || !attempt) return;
    attempt.answers[input.getAttribute('data-qid')] = input.value;
    updateAttemptChrome();
  });

  document.addEventListener('submit', async function (e) {
    var form = e.target.closest('form[data-form]');
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute('data-form');
    var nameInput = form.querySelector('input[name="name"]');
    var errorEl = form.querySelector('#folder-error');
    var submit = form.querySelector('button[type="submit"]');
    var name = nameInput ? nameInput.value.trim() : '';
    if (!name) {
      if (errorEl) errorEl.textContent = 'Give the folder a name.';
      if (nameInput) nameInput.focus();
      return;
    }
    if (name.length > 60) {
      if (errorEl) errorEl.textContent = 'Use 60 characters or fewer.';
      return;
    }
    if (errorEl) errorEl.textContent = '';
    submit.disabled = true;
    var original = submit.innerHTML;
    submit.innerHTML = '<span class="spinner"></span> Saving…';
    try {
      if (kind === 'new-folder') {
        var parent = form.getAttribute('data-parent') || null;
        await repo.createFolder(parent, name);
        closeOverlay();
        renderRoute();
        showToast('Folder created', 'check');
      } else if (kind === 'rename-folder') {
        await repo.renameFolder(form.getAttribute('data-id'), name);
        closeOverlay();
        renderRoute();
        showToast('Folder renamed', 'check');
      }
    } catch (err) {
      if (errorEl) errorEl.textContent = err.message || 'Could not save the folder.';
      submit.disabled = false;
      submit.innerHTML = original;
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOverlay();
  });

  window.addEventListener('hashchange', function () {
    if (attempt && attempt.running) {
      var expected = '#/quizzes/' + attempt.quiz.id + '/attempt';
      if (location.hash !== expected) {
        var target = location.hash;
        history.replaceState(null, '', expected);
        attempt.pendingExitHash = target;
        discardAttemptSheet();
        return;
      }
    }
    if (currentHash !== location.hash) renderRoute();
  });

  window.addEventListener('resize', function () {});

  /* ============================================================
     9. Dev toolbar
     ============================================================ */
  function setTheme(theme, persist) {
    document.documentElement.setAttribute('data-theme', theme);
    var dark = document.getElementById('dev-dark');
    if (dark) dark.checked = theme === 'dark';
    if (persist !== false) {
      try { localStorage.setItem('quiz_app_mock_theme', theme); } catch (e) {}
    }
  }

  function renderDatalog() {
    var list = document.getElementById('datalog-list');
    if (!list) return;
    var count = document.getElementById('datalog-count');
    if (count) count.textContent = String(datalog.length);
    list.innerHTML = datalog.map(function (r) {
      var cls = r.outcome === 'error' ? 'status-5' : 'status-2';
      return '<li><span class="method">' + (r.outcome === 'ok' ? 'OK' : 'ERR') + '</span><span class="path">' + esc(r.name) + '</span><span class="status ' + cls + '">' + r.ms + ' ms</span></li>';
    }).join('');
  }

  function syncDevScreen(value) {
    var sel = document.getElementById('dev-screen');
    if (!sel) return;
    var exists = Array.prototype.some.call(sel.options, function (o) { return o.value === value; });
    var current = sel.querySelector('option[data-current]');
    if (current) current.remove();
    if (!exists) {
      var opt = document.createElement('option');
      opt.value = value;
      opt.textContent = 'Current · ' + value;
      opt.setAttribute('data-current', '');
      sel.appendChild(opt);
    }
    sel.value = value;
  }

  function setupDevTools() {
    var screenSelect = document.getElementById('dev-screen');
    if (screenSelect) {
      screenSelect.addEventListener('change', function () {
        closeOverlay();
        go(screenSelect.value);
      });
    }
    document.querySelectorAll('[data-latency]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        window.__mock.latencyMs = Number(btn.getAttribute('data-latency'));
        document.querySelectorAll('[data-latency]').forEach(function (b) { b.classList.toggle('active', b === btn); });
        var lv = document.getElementById('latency-value');
        if (lv) lv.textContent = window.__mock.latencyMs + ' ms';
      });
    });
    document.querySelectorAll('[data-error]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        window.__mock.errorRate = Number(btn.getAttribute('data-error'));
        document.querySelectorAll('[data-error]').forEach(function (b) { b.classList.toggle('active', b === btn); });
        var ev = document.getElementById('error-value');
        if (ev) ev.textContent = window.__mock.errorRate + '%';
      });
    });
    var dark = document.getElementById('dev-dark');
    if (dark) {
      dark.addEventListener('change', function () {
        setTheme(dark.checked ? 'dark' : 'light', true);
      });
    }
    var shot = document.getElementById('dev-shot');
    if (shot) {
      shot.addEventListener('change', function () {
        document.body.classList.toggle('screenshot-mode', shot.checked);
      });
    }
    var exit = document.getElementById('screenshot-exit');
    if (exit) {
      exit.addEventListener('click', function () {
        document.body.classList.remove('screenshot-mode');
        if (shot) shot.checked = false;
      });
    }
    document.querySelectorAll('[data-dev]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var action = btn.getAttribute('data-dev');
        if (action === 'reset') {
          resetDb();
          closeOverlay();
          clearAttempt();
          importState = null;
          go('/', 'Mock data reset', 'refresh');
        } else if (action === 'sample') {
          closeOverlay();
          go('/import?folder=f-net&sample=valid');
        } else if (action === 'invalid') {
          closeOverlay();
          go('/import?folder=f-net&sample=invalid');
        } else if (action === 'empty') {
          closeOverlay();
          go('/folders/f-empty');
        }
      });
    });
  }

  /* ============================================================
     10. Boot
     ============================================================ */
  var savedTheme = null;
  try { savedTheme = localStorage.getItem('quiz_app_mock_theme'); } catch (e) {}
  setTheme(savedTheme || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);
  setupDevTools();
  if (!location.hash) history.replaceState(null, '', '#/');
  renderRoute();
})();
</script>
</body>
</html>
